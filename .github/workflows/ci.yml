name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pytest
      - name: Syntax check (compileall)
        run: python -m compileall -q game verify_v1.py verify_ai.py verify_ui.py verify_interact.py verify_network.py verify_netui.py build_release.py
      - name: Unit tests
        run: python -m pytest game/tests -q
      - name: Random full games
        run: python verify_v1.py 3
      - name: AI legality + win-rate gradient
        run: |
          python verify_ai.py
          python verify_ai.py --bench 8
          python verify_ai.py --mini --bench 8
          python verify_ai.py --all
      - name: UI headless
        run: |
          python verify_ui.py
          python verify_interact.py
          python verify_ai_ui.py
      - name: Network
        run: |
          python verify_network.py
          python verify_netui.py
